# Checks the YAML frontmatter of researchpho/SKILL.md on every push and every pull request.
# The rules are in .github/scripts/check_frontmatter.py, in this repository. The job installs PyYAML and
# downloads nothing else.
name: Check skill frontmatter

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontmatter:
    name: SKILL.md frontmatter
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"  # PyYAML 6.0.3 has wheels up to CPython 3.14
      - name: Install PyYAML
        run: python -m pip install PyYAML==6.0.3
      - name: Check researchpho/SKILL.md
        run: python .github/scripts/check_frontmatter.py researchpho
