<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ResearchPhO checklist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans:wght@400;500;700&family=Noto+Serif:wght@600;700&display=swap">
<style>
/* Layout: the exam is one vertical trunk (problem by problem, question by question). Items of a left-side category hang on the
   left in their colour frame, items of a right-side category on the right. A research segment continues the trunk after the exam. */
:root {
  --bg: #F4F6F9;
  --grid: #E6EAF0;
  --card: #FFFFFF;
  --fg: #1A1F26;
  --muted: #5B6573;
  --trunk: #2A3340;
  --rule: #C9D0DA;
  --link: #1F5FB4;
  --c-blue: #1F5FB4;   --w-blue: #EAF1FB;   --s-blue: #D4E3F7;
  --c-orange: #C25A06; --w-orange: #FDF0E3; --s-orange: #F9DDBF;
  --c-amber: #9A6A00;  --w-amber: #FBF4DD;  --s-amber: #F3E3AE;
  --c-red: #B0302C;    --w-red: #FCEDEC;    --s-red: #F6D3D1;
  --c-green: #2F7D4F;  --w-green: #E8F5ED;  --s-green: #CBE8D6;
  --c-purple: #6A44A8; --w-purple: #F1ECFA; --s-purple: #DED2F3;
  --done: #2F7D4F;
  --f-display: "Noto Serif", "Noto Serif SC", Georgia, "Times New Roman", serif;
  --f-body: "Noto Sans", "Noto Sans SC", "PingFang SC", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101419; --grid: #18202A; --card: #171D25; --fg: #E5E9EE; --muted: #9AA4B1;
    --trunk: #C7D0DB; --rule: #34404E; --link: #8DB8F2;
    --c-blue: #74A9EE;   --w-blue: #142235;   --s-blue: #1D3352;
    --c-orange: #F2A256; --w-orange: #2E1F10; --s-orange: #4A2F14;
    --c-amber: #E6C15A;  --w-amber: #2B2410;  --s-amber: #463A14;
    --c-red: #F08A84;    --w-red: #301514;    --s-red: #4D1F1D;
    --c-green: #6CC08F;  --w-green: #12261A;  --s-green: #1C3B28;
    --c-purple: #B79BEA; --w-purple: #211A33; --s-purple: #34284F;
    --done: #6CC08F; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101419; --grid: #18202A; --card: #171D25; --fg: #E5E9EE; --muted: #9AA4B1;
  --trunk: #C7D0DB; --rule: #34404E; --link: #8DB8F2;
  --c-blue: #74A9EE;   --w-blue: #142235;   --s-blue: #1D3352;
  --c-orange: #F2A256; --w-orange: #2E1F10; --s-orange: #4A2F14;
  --c-amber: #E6C15A;  --w-amber: #2B2410;  --s-amber: #463A14;
  --c-red: #F08A84;    --w-red: #301514;    --s-red: #4D1F1D;
  --c-green: #6CC08F;  --w-green: #12261A;  --s-green: #1C3B28;
  --c-purple: #B79BEA; --w-purple: #211A33; --s-purple: #34284F;
  --done: #6CC08F; color-scheme: dark;
}
* { box-sizing: border-box; }
html { color-scheme: light; }
body {
  margin: 0;
  background-color: var(--bg);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 28px 28px;
  color: var(--fg); font-family: var(--f-body); font-size: 15px; line-height: 1.55;
}
[hidden] { display: none !important; }
a { color: var(--link); }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 20px; padding-block: 28px 64px; }
header.top { display: grid; gap: 16px; margin-bottom: 26px; }
.eyebrow { font-family: var(--f-mono); font-size: 12px; letter-spacing: .08em; color: var(--muted); text-transform: uppercase; }
h1 { font-family: var(--f-display); font-weight: 700; font-size: clamp(26px, 4vw, 38px); line-height: 1.2; margin: 0; text-wrap: balance; }
.lede { margin: 0; max-width: 68ch; color: var(--muted); }
.panel { background: var(--card); border: 1px solid var(--rule); border-radius: 10px; padding: 14px 16px; display: grid; gap: 14px; }
.meters { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; }
.meter { display: grid; gap: 6px; min-width: 0; }
.meter .row1 { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.meter .lbl { font-weight: 700; font-size: 14px; }
.meter .num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; font-size: 13px; color: var(--muted); }
.bar { height: 8px; border-radius: 4px; background: var(--grid); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; border-radius: 4px; background: var(--done); transition: width .25s ease; }
.controls { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 13px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.swatch { width: 18px; height: 12px; border-radius: 3px; border: 2px solid; display: inline-block; }
.btns { display: flex; flex-wrap: wrap; gap: 6px; }
button { font: 500 13px/1 var(--f-body); color: var(--fg); background: var(--card); border: 1px solid var(--rule); border-radius: 999px; padding: 7px 12px; cursor: pointer; }
button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
button.warn { color: var(--c-red); border-color: var(--c-red); }
button:focus-visible, .item input:focus-visible, a:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }

.track { position: relative; }
.track::before { content: ""; position: absolute; top: 0; bottom: 0; left: 50%; width: 3px; transform: translateX(-50%); background: var(--trunk); border-radius: 2px; z-index: 0; }
.terminal, .phead { position: relative; z-index: 2; margin-inline: auto; background: var(--card); border: 2px solid var(--trunk); }
.terminal { max-width: 560px; border-radius: 14px; padding: 14px 18px; display: grid; gap: 6px; }
.terminal h2 { margin: 0; font-family: var(--f-display); font-size: 19px; }
.terminal p { margin: 0; color: var(--muted); font-size: 14px; }
.terminal.end { margin-top: 44px; }
.phead { max-width: 660px; border-radius: 10px; padding: 12px 18px; margin-block: 44px 22px; display: grid; gap: 4px; }
.phead.research { border-style: dashed; }
.phead .code { font-family: var(--f-mono); font-size: 12px; letter-spacing: .06em; color: var(--muted); display: flex; justify-content: space-between; gap: 10px; }
.phead h2 { margin: 0; font-family: var(--f-display); font-size: 21px; line-height: 1.3; text-wrap: balance; }
.phead .q { margin: 0; font-size: 14px; color: var(--muted); }
.phead .bar { margin-top: 6px; }

.row { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) 250px minmax(0, 1fr); gap: 30px; align-items: center; margin-block: 18px; }
.row::before { content: ""; position: absolute; left: 6%; right: 6%; top: 50%; border-top: 2px dashed var(--rule); z-index: 0; }
.col { position: relative; z-index: 1; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.node { position: relative; z-index: 2; background: var(--card); border: 2px solid var(--trunk); border-radius: 10px; padding: 10px 12px; display: grid; gap: 5px; }
.node .code { font-family: var(--f-mono); font-weight: 600; font-size: 13px; display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.node .pts { color: var(--muted); font-weight: 500; white-space: nowrap; }
.node .tag { font-family: var(--f-mono); font-size: 11.5px; font-weight: 600; border: 1px solid currentColor; border-radius: 4px; padding: 0 5px; white-space: nowrap; }
.node h3 { margin: 0; font-size: 15.5px; line-height: 1.35; text-wrap: balance; }
.node .nnote { margin: 0; font-size: 12.5px; color: var(--muted); line-height: 1.45; }
.node .state { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.node.complete { border-color: var(--done); }
.node.complete .state { color: var(--done); font-weight: 700; }

.item { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px; align-items: start; border: 2px solid; border-radius: 8px; padding: 8px 10px; cursor: pointer; transition: background-color .15s ease; }
.item input { margin: 3px 0 0; width: 16px; height: 16px; cursor: pointer; }
.item .t { display: block; font-weight: 700; font-size: 14px; line-height: 1.4; }
.item .n { display: block; font-size: 12.5px; color: var(--muted); line-height: 1.45; }
.item .r { display: block; font-size: 12px; line-height: 1.45; margin-top: 2px; overflow-wrap: anywhere; }
.item .r .meta { color: var(--muted); font-family: var(--f-mono); font-size: 11.5px; }
.item.done .t::after { content: " \2713"; color: var(--done); }
.remind { display: inline-flex; align-items: center; gap: 6px; border: 1.5px dashed; border-radius: 999px; padding: 3px 10px; font-size: 12.5px; color: var(--muted); align-self: flex-start; background: var(--card); }
.col.left .remind { align-self: flex-end; }
.remind.done::after { content: "\2713"; color: var(--done); font-weight: 700; }
.empty { font-size: 12.5px; color: var(--muted); font-style: italic; }
.col.left .empty { text-align: right; }

footer { margin-top: 36px; font-size: 13px; color: var(--muted); display: grid; gap: 6px; max-width: 76ch; }
footer p { margin: 0; }

@media (max-width: 880px) {
  .track::before { left: 13px; transform: none; }
  .terminal, .phead { margin-left: 34px; margin-right: 0; }
  .row { grid-template-columns: minmax(0, 1fr); gap: 8px; padding-left: 34px; }
  .row::before { display: none; }
  .row .node { order: -1; }
  .col.left .remind { align-self: flex-start; }
  .empty { display: none; }
  .node::before { content: ""; position: absolute; left: -28px; top: 16px; width: 12px; height: 12px; border-radius: 50%; background: var(--card); border: 3px solid var(--trunk); }
  .node.complete::before { border-color: var(--done); background: var(--done); }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="eyebrow" id="eyebrow"></div>
    <h1 id="title"></h1>
    <p class="lede" id="intro"></p>
    <div class="panel">
      <div class="meters" id="meters"></div>
      <div class="controls">
        <div class="legend" id="legend"></div>
        <div class="btns" role="group" aria-label="Filter" id="filters"></div>
      </div>
    </div>
  </header>
  <main class="track" id="track"></main>
  <footer id="footer"></footer>
</div>

<script type="application/json" id="checklist-data">
{"schema": "researchpho-checklist/2", "lang": "en", "title": "Checklist", "categories": [], "items": {}, "groups": []}
</script>
<script>
(function () {
  var data = JSON.parse(document.getElementById("checklist-data").textContent);
  if (data.lang) { document.documentElement.setAttribute("lang", data.lang); }
  var cats = data.categories || [];
  var catById = {};
  cats.forEach(function (c) { catById[c.id] = c; });
  var KEY = "researchpho-checklist:" + (data.storageKey || data.title);
  var state = {};
  try { state = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { state = {}; }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) { n.className = cls; }
    if (text != null) { n.textContent = text; }
    return n;
  }
  function frame(n, colour) {
    n.style.borderColor = "var(--c-" + colour + ")";
    n.style.background = "var(--w-" + colour + ")";
  }

  document.getElementById("eyebrow").textContent = data.eyebrow || "";
  document.getElementById("title").textContent = data.title || "";
  document.getElementById("intro").textContent = data.intro || "";

  var meters = document.getElementById("meters");
  var meterEls = {};
  cats.concat([{ id: "*", plural: "All items", colour: "green" }]).forEach(function (c) {
    var m = el("div", "meter");
    var r1 = el("div", "row1");
    var lbl = el("span", "lbl", c.plural || c.name);
    lbl.style.color = c.id === "*" ? "var(--fg)" : "var(--c-" + c.colour + ")";
    var num = el("span", "num", "0 / 0");
    r1.appendChild(lbl); r1.appendChild(num); m.appendChild(r1);
    var bar = el("div", "bar"); var bi = document.createElement("i");
    bi.style.background = c.id === "*" ? "var(--done)" : "var(--c-" + c.colour + ")";
    bar.appendChild(bi); m.appendChild(bar); meters.appendChild(m);
    meterEls[c.id] = { num: num, bar: bi };
  });

  var legend = document.getElementById("legend");
  cats.forEach(function (c) {
    var s = el("span");
    var sw = el("i", "swatch"); frame(sw, c.colour);
    s.appendChild(sw); s.appendChild(document.createTextNode(c.name + (c.side === "left" ? " (left)" : " (right)")));
    legend.appendChild(s);
  });

  var filters = document.getElementById("filters");
  var filterBtns = [];
  function setFilter(id) {
    document.querySelectorAll(".item, .remind").forEach(function (n) {
      n.hidden = !(id === "*" || n.getAttribute("data-cat") === id);
    });
    filterBtns.forEach(function (b) { b.setAttribute("aria-pressed", String(b.getAttribute("data-id") === id)); });
  }
  [{ id: "*" }].concat(cats).forEach(function (c) {
    var p = c.plural || c.name || "";
    var shown = /^[A-Z][a-z]/.test(p) ? p.charAt(0).toLowerCase() + p.slice(1) : p;
    var b = el("button", "", c.id === "*" ? "All" : "Only " + shown);
    b.type = "button"; b.setAttribute("data-id", c.id); b.setAttribute("aria-pressed", "false");
    b.addEventListener("click", function () { setFilter(c.id); });
    filters.appendChild(b); filterBtns.push(b);
  });
  var reset = el("button", "", "Clear ticks"); reset.type = "button"; filters.appendChild(reset);

  var track = document.getElementById("track");
  var seen = {}, boxes = {}, reminders = {}, nodeMeta = [], groupMeta = [];

  function makeItem(id) {
    var it = data.items[id]; var c = catById[it.category];
    if (seen[id]) {
      var rem = el("span", "remind", it.name); rem.setAttribute("data-cat", it.category);
      rem.style.borderColor = "var(--c-" + c.colour + ")";
      rem.title = "Introduced at an earlier question";
      (reminders[id] = reminders[id] || []).push(rem);
      return rem;
    }
    seen[id] = true;
    var label = el("label", "item"); label.setAttribute("data-cat", it.category); frame(label, c.colour);
    var cb = document.createElement("input"); cb.type = "checkbox"; cb.id = "cb-" + id; cb.checked = !!state[id];
    cb.style.accentColor = "var(--c-" + c.colour + ")";
    var txt = el("span", "txt");
    txt.appendChild(el("span", "t", it.name));
    if (it.note) { txt.appendChild(el("span", "n", it.note)); }
    if (it.ref || it.meta) {
      var ref = el("span", "r");
      if (it.meta) { ref.appendChild(el("span", "meta", it.meta + (it.ref ? " · " : ""))); }
      if (it.ref) {
        if (it.url) {
          var a = el("a", "", it.ref); a.href = it.url; a.target = "_blank"; a.rel = "noopener";
          a.addEventListener("click", function (e) { e.stopPropagation(); });
          ref.appendChild(a);
        } else { ref.appendChild(document.createTextNode(it.ref)); }
      }
      txt.appendChild(ref);
    }
    label.appendChild(cb); label.appendChild(txt);
    cb.addEventListener("change", function () {
      if (cb.checked) { state[id] = 1; } else { delete state[id]; }
      save(); refresh();
    });
    boxes[id] = { cb: cb, label: label, cat: it.category };
    return label;
  }

  function addTerminal(t, cls) {
    if (!t) { return; }
    var n = el("div", "terminal" + (cls ? " " + cls : ""));
    n.appendChild(el("h2", "", t.title));
    if (t.text) { n.appendChild(el("p", "", t.text)); }
    track.appendChild(n);
  }

  addTerminal(data.start);
  (data.groups || []).forEach(function (g) {
    var research = g.kind === "research";
    var head = el("div", "phead" + (research ? " research" : ""));
    var code = el("div", "code");
    code.appendChild(el("span", "", (g.short || "") + (g.points ? " · " + g.points + " points" : "")));
    var pnum = el("span", "", ""); code.appendChild(pnum); head.appendChild(code);
    head.appendChild(el("h2", "", g.title));
    if (g.note) { head.appendChild(el("p", "q", g.note)); }
    var pb = el("div", "bar"); var pbi = document.createElement("i"); pb.appendChild(pbi); head.appendChild(pb);
    track.appendChild(head);
    var ids = [];
    g.nodes.forEach(function (nd) {
      var row = el("section", "row");
      var left = el("div", "col left"), right = el("div", "col right");
      (nd.needs || []).forEach(function (id) {
        var c = catById[data.items[id].category];
        (c.side === "left" ? left : right).appendChild(makeItem(id));
        if (ids.indexOf(id) < 0) { ids.push(id); }
      });
      if (!left.childNodes.length && data.emptyNote) { left.appendChild(el("span", "empty", data.emptyNote)); }
      if (!right.childNodes.length && data.emptyNote) { right.appendChild(el("span", "empty", data.emptyNote)); }
      var node = el("div", "node");
      var nc = el("div", "code"); nc.appendChild(el("span", "", nd.label));
      if (nd.points != null) { nc.appendChild(el("span", "pts", Number(nd.points).toFixed(1) + " pt")); }
      else if (nd.meta) {
        var tag = el("span", "tag", nd.meta);
        tag.style.color = /theory/.test(nd.meta) ? "var(--c-red)" : /calc/.test(nd.meta) ? "var(--c-amber)" : "var(--muted)";
        nc.appendChild(tag);
      }
      node.appendChild(nc);
      if (nd.title) { node.appendChild(el("h3", "", nd.title)); }
      if (nd.note) { node.appendChild(el("p", "nnote", nd.note)); }
      var st = el("div", "state", ""); node.appendChild(st);
      row.appendChild(left); row.appendChild(node); row.appendChild(right);
      track.appendChild(row);
      nodeMeta.push({ node: node, st: st, ids: (nd.needs || []).slice() });
    });
    groupMeta.push({ ids: ids, num: pnum, bar: pbi });
  });
  addTerminal(data.end, "end");

  var footer = document.getElementById("footer");
  (data.footer || []).forEach(function (p) { footer.appendChild(el("p", "", p)); });

  function count(ids) { return ids.filter(function (id) { return !!state[id]; }).length; }
  function refresh() {
    Object.keys(boxes).forEach(function (id) {
      var b = boxes[id];
      b.cb.checked = !!state[id];
      b.label.classList.toggle("done", !!state[id]);
      b.label.style.background = "var(--" + (state[id] ? "s-" : "w-") + catById[b.cat].colour + ")";
      (reminders[id] || []).forEach(function (r) { r.classList.toggle("done", !!state[id]); });
    });
    var all = Object.keys(boxes);
    cats.concat([{ id: "*" }]).forEach(function (c) {
      var ids = c.id === "*" ? all : all.filter(function (id) { return boxes[id].cat === c.id; });
      var k = count(ids), n = ids.length;
      meterEls[c.id].num.textContent = k + " / " + n;
      meterEls[c.id].bar.style.width = (n ? 100 * k / n : 0) + "%";
    });
    nodeMeta.forEach(function (m) {
      var k = count(m.ids), n = m.ids.length;
      m.st.textContent = n === 0 ? "" : (k === n ? "Done " : "Progress ") + k + " / " + n;
      m.node.classList.toggle("complete", n > 0 && k === n);
    });
    groupMeta.forEach(function (g) {
      var k = count(g.ids), n = g.ids.length;
      g.num.textContent = k + " / " + n;
      g.bar.style.width = (n ? 100 * k / n : 0) + "%";
    });
  }

  var armed = null;
  reset.addEventListener("click", function () {
    if (!armed) {
      reset.textContent = "Click again to clear"; reset.classList.add("warn");
      armed = setTimeout(function () { armed = null; reset.textContent = "Clear ticks"; reset.classList.remove("warn"); }, 3000);
      return;
    }
    clearTimeout(armed); armed = null; state = {}; save();
    reset.textContent = "Cleared"; reset.classList.remove("warn");
    setTimeout(function () { reset.textContent = "Clear ticks"; }, 1500);
    refresh();
  });

  setFilter("*");
  refresh();
})();
</script>
</body>
</html>
