   "ref": "H.-P. Breuer and F. Petruccione, The Theory of Open Quantum Systems (Oxford, 2002), Ch. 3",
   "url": "https://doi.org/10.1093/acprof:oso/9780199213900.001.0001"
  },
  "certified-bounds": {
   "category": "idea",
   "name": "Certified bounds and decisions with error bars",
   "note": "What a sufficient bound guarantees, and how to decide with an interval instead of a single number.",
   "ref": "R. E. Moore, R. B. Kearfott, M. J. Cloud, Introduction to Interval Analysis (SIAM, 2009)",
   "url": "https://doi.org/10.1137/1.9780898717716"
  },
  "prethermalization": {
   "category": "idea",
   "name": "Prethermalization in driven many-body systems",
   "note": "Why a driven interacting system can keep its order for a long but finite time, and what controls that time.",
   "ref": "D. Abanin, W. De Roeck, W. W. Ho, F. Huveneers, A rigorous theory of many-body prethermalization for periodically driven and closed quantum systems, Commun. Math. Phys. 354, 809 (2017)",
   "url": "https://arxiv.org/abs/1509.05386"
  },
  "following-one-flavor": {
   "category": "O-theory",
   "name": "The particles keep following one flavor",
   "meta": "questions 1.A.1, 1.D.1",
   "note": "a gap above the two flavor configurations, uniform in system size and over the cycle; the composite gap protects only the plane, not the direction in it",
   "ref": "many-body adiabatic theorem; many-body Chern number (Niu-Thouless-Wu)",
   "url": "https://doi.org/10.1103/PhysRevB.31.3372"
  },
  "dressing-assembled": {
   "category": "O-calc",
   "name": "Local dressing assembled along the chain and the cycle",
   "meta": "questions 2.B.1, 2.B.2",
   "note": "build the corrections at every phase, join them smoothly, bound the overlap terms",
   "ref": "Schrieffer-Wolff expansion; locality (cluster) estimates",
   "url": "https://arxiv.org/abs/1105.0675"
  },
  "kept-dynamics": {
   "category": "O-theory",
   "name": "The kept dynamics K_ret",
   "meta": "questions 2.C.1, 2.C.2",
   "note": "a spectral gap uniform in system size",
   "ref": "S. Bachmann, W. De Roeck, M. Fraas, The adiabatic theorem and linear response theory for extended quantum systems",
   "url": "https://arxiv.org/abs/1705.02838"
  },
  "local-state-full-drive": {
   "category": "O-theory",
   "name": "The local state over the full drive",
   "meta": "question 3.A.3",
   "note": "the bounds grow with time; the boundary correlations do not close at the times of interest",
   "ref": "Lieb-Robinson and local perturbation bounds",
   "url": "https://arxiv.org/abs/1008.5137"
  },
  "certificate-inputs": {
   "category": "O-calc",
   "name": "The certificate inputs α, I₀, η, δ₀, t_max",
   "meta": "question 3.B.1",
   "note": "evaluate them in one frame for one initial state, once the local state is controlled",
   "ref": "M. B. Hastings, Locality in Quantum Systems (trace-distance and locality bounds)",
   "url": "https://arxiv.org/abs/1008.5137"
  },
  "first-failure": {
   "category": "O-theory",
   "name": "The first failed window",
   "meta": "question 3.C.2",
   "note": "a fast drive or a large gap; here the drive is slow",
   "ref": "rigorous prethermalization (Abanin-De Roeck-Ho-Huveneers; Else-Bauer-Nayak)",
   "url": "https://arxiv.org/abs/1509.05386"
  }
 },

  "Shared gap of the O-theory links: no existing theory controls a slowly driven, strongly correlated chain over long times when its order is not protected by a uniform gap. A first controlled result is a limit in which the failing hypothesis holds, for example a gap that protects the whole group of flavor configurations rather than one of them."

<script>
(function () {
  var data = JSON.parse(document.getElementById("checklist-data").textContent);
  if (data.lang) { document.documentElement.setAttribute("lang", data.lang); }
  var cats = data.categories || [];
  var catById = {};
  cats.forEach(function (c) { catById[c.id] = c; });
  var KEY = "researchpho-checklist:" + (data.storageKey || data.title);
  var state = {};
  try { state = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { state = {}; }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) { n.className = cls; }
    if (text != null) { n.textContent = text; }
    return n;
  }
  function frame(n, colour) {
    n.style.borderColor = "var(--c-" + colour + ")";
    n.style.background = "var(--w-" + colour + ")";
  }

  document.getElementById("eyebrow").textContent = data.eyebrow || "";
  document.getElementById("title").textContent = data.title || "";
  document.getElementById("intro").textContent = data.intro || "";

  var meters = document.getElementById("meters");
  var meterEls = {};
  cats.concat([{ id: "*", plural: "All items", colour: "green" }]).forEach(function (c) {
    var m = el("div", "meter");
    var r1 = el("div", "row1");
    var lbl = el("span", "lbl", c.plural || c.name);
    lbl.style.color = c.id === "*" ? "var(--fg)" : "var(--c-" + c.colour + ")";
    var num = el("span", "num", "0 / 0");
    r1.appendChild(lbl); r1.appendChild(num); m.appendChild(r1);
    var bar = el("div", "bar"); var bi = document.createElement("i");
    bi.style.background = c.id === "*" ? "var(--done)" : "var(--c-" + c.colour + ")";
    bar.appendChild(bi); m.appendChild(bar); meters.appendChild(m);
    meterEls[c.id] = { num: num, bar: bi };
  });

  var legend = document.getElementById("legend");
  cats.forEach(function (c) {
    var s = el("span");
    var sw = el("i", "swatch"); frame(sw, c.colour);
    s.appendChild(sw); s.appendChild(document.createTextNode(c.name + (c.side === "left" ? " (left)" : " (right)")));
    legend.appendChild(s);
  });

  var filters = document.getElementById("filters");
  var filterBtns = [];
  function setFilter(id) {
    document.querySelectorAll(".item, .remind").forEach(function (n) {
      n.hidden = !(id === "*" || n.getAttribute("data-cat") === id);
    });
    filterBtns.forEach(function (b) { b.setAttribute("aria-pressed", String(b.getAttribute("data-id") === id)); });
  }
  [{ id: "*" }].concat(cats).forEach(function (c) {
    var p = c.plural || c.name || "";
    var shown = /^[A-Z][a-z]/.test(p) ? p.charAt(0).toLowerCase() + p.slice(1) : p;
    var b = el("button", "", c.id === "*" ? "All" : "Only " + shown);
    b.type = "button"; b.setAttribute("data-id", c.id); b.setAttribute("aria-pressed", "false");
    b.addEventListener("click", function () { setFilter(c.id); });
    filters.appendChild(b); filterBtns.push(b);
  });
  var reset = el("button", "", "Clear ticks"); reset.type = "button"; filters.appendChild(reset);

  var track = document.getElementById("track");
  var seen = {}, boxes = {}, reminders = {}, nodeMeta = [], groupMeta = [];

  function makeItem(id) {
    var it = data.items[id]; var c = catById[it.category];
    if (seen[id]) {
      var rem = el("span", "remind", it.name); rem.setAttribute("data-cat", it.category);
      rem.style.borderColor = "var(--c-" + c.colour + ")";
      rem.title = "Introduced at an earlier question";
      (reminders[id] = reminders[id] || []).push(rem);
      return rem;
    }
    seen[id] = true;
    var label = el("label", "item"); label.setAttribute("data-cat", it.category); frame(label, c.colour);
    var cb = document.createElement("input"); cb.type = "checkbox"; cb.id = "cb-" + id; cb.checked = !!state[id];
    cb.style.accentColor = "var(--c-" + c.colour + ")";
    var txt = el("span", "txt");
    txt.appendChild(el("span", "t", it.name));
    if (it.note) { txt.appendChild(el("span", "n", it.note)); }
    if (it.ref || it.meta) {
      var ref = el("span", "r");
      if (it.meta) { ref.appendChild(el("span", "meta", it.meta + (it.ref ? " · " : ""))); }
      if (it.ref) {
        if (it.url) {
          var a = el("a", "", it.ref); a.href = it.url; a.target = "_blank"; a.rel = "noopener";
          a.addEventListener("click", function (e) { e.stopPropagation(); });
          ref.appendChild(a);
        } else { ref.appendChild(document.createTextNode(it.ref)); }
      }
      txt.appendChild(ref);
    }
    label.appendChild(cb); label.appendChild(txt);
    cb.addEventListener("change", function () {
      if (cb.checked) { state[id] = 1; } else { delete state[id]; }
      save(); refresh();
    });
    boxes[id] = { cb: cb, label: label, cat: it.category };
    return label;
  }

  function addTerminal(t, cls) {
    if (!t) { return; }
    var n = el("div", "terminal" + (cls ? " " + cls : ""));
    n.appendChild(el("h2", "", t.title));
    if (t.text) { n.appendChild(el("p", "", t.text)); }
    track.appendChild(n);
  }

  addTerminal(data.start);
  (data.groups || []).forEach(function (g) {
    var research = g.kind === "research";
    var head = el("div", "phead" + (research ? " research" : ""));
    var code = el("div", "code");
    code.appendChild(el("span", "", (g.short || "") + (g.points ? " · " + g.points + " points" : "")));
    var pnum = el("span", "", ""); code.appendChild(pnum); head.appendChild(code);
    head.appendChild(el("h2", "", g.title));
    if (g.note) { head.appendChild(el("p", "q", g.note)); }
    var pb = el("div", "bar"); var pbi = document.createElement("i"); pb.appendChild(pbi); head.appendChild(pb);
    track.appendChild(head);
    var ids = [];
    g.nodes.forEach(function (nd) {
      var row = el("section", "row");
      var left = el("div", "col left"), right = el("div", "col right");
      (nd.needs || []).forEach(function (id) {
        var c = catById[data.items[id].category];
        (c.side === "left" ? left : right).appendChild(makeItem(id));
        if (ids.indexOf(id) < 0) { ids.push(id); }
      });
      if (!left.childNodes.length && data.emptyNote) { left.appendChild(el("span", "empty", data.emptyNote)); }
      if (!right.childNodes.length && data.emptyNote) { right.appendChild(el("span", "empty", data.emptyNote)); }
      var node = el("div", "node");
      var nc = el("div", "code"); nc.appendChild(el("span", "", nd.label));
      if (nd.points != null) { nc.appendChild(el("span", "pts", Number(nd.points).toFixed(1) + " pt")); }
      else if (nd.meta) {
        var tag = el("span", "tag", nd.meta);
        tag.style.color = /theory/.test(nd.meta) ? "var(--c-red)" : /calc/.test(nd.meta) ? "var(--c-amber)" : "var(--muted)";
        nc.appendChild(tag);
      }
      node.appendChild(nc);
      if (nd.title) { node.appendChild(el("h3", "", nd.title)); }
      if (nd.note) { node.appendChild(el("p", "nnote", nd.note)); }
      var st = el("div", "state", ""); node.appendChild(st);
      row.appendChild(left); row.appendChild(node); row.appendChild(right);
      track.appendChild(row);
      nodeMeta.push({ node: node, st: st, ids: (nd.needs || []).slice() });
    });
    groupMeta.push({ ids: ids, num: pnum, bar: pbi });
  });
  addTerminal(data.end, "end");

  var footer = document.getElementById("footer");
  (data.footer || []).forEach(function (p) { footer.appendChild(el("p", "", p)); });

  function count(ids) { return ids.filter(function (id) { return !!state[id]; }).length; }
  function refresh() {
    Object.keys(boxes).forEach(function (id) {
      var b = boxes[id];
      b.cb.checked = !!state[id];
      b.label.classList.toggle("done", !!state[id]);
      b.label.style.background = "var(--" + (state[id] ? "s-" : "w-") + catById[b.cat].colour + ")";
      (reminders[id] || []).forEach(function (r) { r.classList.toggle("done", !!state[id]); });
    });
    var all = Object.keys(boxes);
    cats.concat([{ id: "*" }]).forEach(function (c) {
      var ids = c.id === "*" ? all : all.filter(function (id) { return boxes[id].cat === c.id; });
      var k = count(ids), n = ids.length;
      meterEls[c.id].num.textContent = k + " / " + n;
      meterEls[c.id].bar.style.width = (n ? 100 * k / n : 0) + "%";
    });
    nodeMeta.forEach(function (m) {
      var k = count(m.ids), n = m.ids.length;
      m.st.textContent = n === 0 ? "" : (k === n ? "Done " : "Progress ") + k + " / " + n;
      m.node.classList.toggle("complete", n > 0 && k === n);
    });
    groupMeta.forEach(function (g) {
      var k = count(g.ids), n = g.ids.length;
      g.num.textContent = k + " / " + n;
      g.bar.style.width = (n ? 100 * k / n : 0) + "%";
    });
  }

  var armed = null;
  reset.addEventListener("click", function () {
    if (!armed) {
      reset.textContent = "Click again to clear"; reset.classList.add("warn");
      armed = setTimeout(function () { armed = null; reset.textContent = "Clear ticks"; reset.classList.remove("warn"); }, 3000);
      return;
    }
    clearTimeout(armed); armed = null; state = {}; save();
    reset.textContent = "Cleared"; reset.classList.remove("warn");
    setTimeout(function () { reset.textContent = "Clear ticks"; }, 1500);
    refresh();
  });

  setFilter("*");
  refresh();
})();
</script>
</body>
